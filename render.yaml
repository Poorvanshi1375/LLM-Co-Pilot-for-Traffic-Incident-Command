services:
  - type: web
    name: trafficmind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # LLM keys (comma-separated pools are optional extras for failover)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEYS
        sync: false
      # Optional model overrides (defaults: openai/gpt-oss-120b, gemini-2.5-flash)
      - key: GROQ_MODEL
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      # Security: operator token for settings, and the browser origins allowed to call the API.
      # This service is Blueprint-managed: a "value:" here overwrites the dashboard on every
      # sync, so anything you set by hand is "sync: false" (set once in the dashboard).
      - key: ADMIN_TOKEN
        generateValue: true   # Render generates it once; copy it from the Environment page
      - key: ALLOWED_ORIGINS
        sync: false           # e.g. https://<your-vercel-production-domain>
      # Twitter/X stays off unless TWITTER_ENABLED is "true"
      - key: TWITTER_ENABLED
        value: "false"
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      # Automatic incident detection from the feed (off for the public demo)
      - key: AUTO_DETECT_INCIDENTS
        value: "false"
